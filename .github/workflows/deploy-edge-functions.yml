name: Deploy Edge Functions

# Trigger: every push to main, plus manual dispatch from the Actions tab.
# Tip: to run only when the function code changes, add a `paths:` filter
# under `push:` (e.g. paths: ['supabase/functions/process-upload/**']).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-edge-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy process-upload
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: oxgbtbdkvxyraxbtpdjt
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify access token is set
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set on this repository."
            echo "Add it at: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

      - name: Deploy process-upload
        run: |
          supabase functions deploy process-upload \
            --project-ref "${SUPABASE_PROJECT_REF}"
