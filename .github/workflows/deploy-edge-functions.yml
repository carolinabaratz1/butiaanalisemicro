# Workflow desabilitado — o projeto usa Supabase gerenciado pelo Lovable
# O token de acesso não tem permissão para fazer deploy via CLI externo.
# Para reabilitar, restaure o trigger abaixo e configure o SUPABASE_ACCESS_TOKEN correto.

name: Deploy Edge Functions

on: [] # desabilitado

# on:
#   push:
#     branches: [main]
#   workflow_dispatch:

concurrency:
  group: deploy-edge-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy process-upload
    runs-on: ubuntu-latest
    if: false # desabilitado
    env:
      SUPABASE_PROJECT_REF: oxgbtbdkvxyraxbtpdjt
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Error: SUPABASE_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          echo "Access token is configured"

      - name: Deploy process-upload
        run: |
          supabase functions deploy process-upload \
            --project-ref $SUPABASE_PROJECT_REF
